<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载教材 - 中国教材库</title>
<style>
:root{
  --c-primary:#1677ff;--c-primary-dark:#0958d9;--c-bg:#f5f7fa;--c-card:#fff;
  --c-text:#1f2329;--c-text-2:#646a73;--c-border:#e5e6eb;--c-green:#00b42a;
  --radius:12px;--shadow:0 1px 4px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
a{color:inherit;text-decoration:none}
.container{max-width:500px;width:100%}
.card{background:var(--c-card);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:40px;text-align:center}
.card .icon{font-size:60px;margin-bottom:16px}
.card h1{font-size:22px;font-weight:700;margin-bottom:12px}
.card .desc{font-size:14px;color:var(--c-text-2);margin-bottom:24px}
.card .file-info{background:#f7f8fa;border-radius:12px;padding:16px;margin-bottom:24px;text-align:left}
.card .file-info .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.card .file-info .row .k{color:var(--c-text-2)}
.card .file-info .row .v{font-weight:500}
.btn{display:inline-block;padding:12px 32px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-dark)}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);margin-left:8px}
.btn-outline:hover{border-color:var(--c-primary);color:var(--c-primary)}
.back-link{margin-top:16px;font-size:14px;color:var(--c-text-2)}
.back-link a:hover{color:var(--c-primary)}
.loading{font-size:14px;color:var(--c-text-2)}
.error{color:var(--c-text-2);background:#fff1f0;border:1px solid #ffccc7;border-radius:8px;padding:12px;margin-top:16px}
@media(max-width:640px){.card{padding:24px}}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="icon" id="icon">📖</div>
    <h1 id="title">正在获取教材信息…</h1>
    <div class="desc" id="desc">请稍候</div>
    <div id="content"></div>
  </div>
  <div class="back-link"><a href="index.html">← 返回教材列表</a></div>
</div>

<script>
// 从 URL 参数获取教材信息
const params = new URLSearchParams(window.location.search);
const bookId = params.get('book');
const bookName = params.get('name');

if(!bookId || !bookName){
  document.getElementById('icon').textContent = '⚠️';
  document.getElementById('title').textContent = '缺少参数';
  document.getElementById('desc').textContent = '请从教材列表页进入下载页';
  document.getElementById('content').innerHTML = '<div class="error">链接缺少 book 和 name 参数</div>';
}else{
  document.getElementById('title').textContent = bookName;
  document.getElementById('desc').textContent = '点击下方按钮直接下载 PDF 文件';
  document.getElementById('content').innerHTML = `
    <div class="file-info">
      <div class="row"><span class="k">文件名</span><span class="v">${bookName}.pdf</span></div>
      <div class="row"><span class="k">格式</span><span class="v">PDF</span></div>
    </div>
    <a class="btn btn-primary" href="${bookId}" target="_blank">⬇ 下载 PDF</a>
    <a class="btn btn-outline" href="index.html">返回列表</a>
  `;
}
</script>
</body>
</html>
