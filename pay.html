<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购买教材 - 中国教材库</title>
<style>
:root{--c-primary:#1677ff;--c-primary-dark:#0958d9;--c-bg:#f5f7fa;--c-card:#fff;--c-text:#1f2329;--c-text-2:#646a73;--c-border:#e5e6eb;--c-green:#00b42a;--c-orange:#ff7d00;--c-red:#f53f3f;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6}
a{color:inherit;text-decoration:none}
.container{max-width:900px;margin:0 auto;padding:0 20px}
header{background:var(--c-card);border-bottom:1px solid var(--c-border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
header .container{display:flex;align-items:center;height:64px;gap:24px}
header h1{font-size:20px;font-weight:700;white-space:nowrap}
header h1 .logo{color:var(--c-primary)}
header .back{font-size:14px;color:var(--c-text-2);cursor:pointer}
header .back:hover{color:var(--c-primary)}

/* 教材信息 */
.book-info{background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-top:24px}
.book-info h2{font-size:20px;font-weight:700;margin-bottom:12px}
.book-info .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--c-text-2)}
.book-info .meta span{display:inline-flex;align-items:center;gap:4px}
.book-info .meta .badge{font-size:11px;padding:2px 8px;border-radius:4px}
.badge.stage{background:#e8f3ff;color:#1677ff}
.badge.subject{background:#f6ffed;color:#00b42a}

/* 价格选项 */
.pricing-section{margin-top:24px}
.pricing-section h3{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--c-text-2)}
.pricing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.price-card{background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:2px solid transparent;cursor:pointer;transition:.2s;text-align:center}
.price-card:hover{border-color:var(--c-primary)}
.price-card.selected{border-color:var(--c-primary);background:#e8f3ff}
.price-card .name{font-size:15px;font-weight:600;margin-bottom:4px}
.price-card .price{font-size:28px;font-weight:800;color:var(--c-primary);margin:8px 0}
.price-card .price .currency{font-size:14px;font-weight:400;color:var(--c-text-2)}
.price-card .desc{font-size:12px;color:var(--c-text-2);margin-top:4px}
.price-card .badge-popular{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;background:#fff7e8;color:#ff7d00;margin-top:6px}

/* 支付按钮 */
.pay-section{background:var(--c-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-top:24px;text-align:center}
.pay-section .total{font-size:16px;font-weight:600;margin-bottom:16px}
.pay-section .total .amount{font-size:32px;font-weight:800;color:var(--c-primary)}
.pay-section .btn{display:inline-block;padding:14px 48px;border-radius:10px;font-size:18px;font-weight:600;cursor:pointer;border:none;transition:.15s;background:var(--c-primary);color:#fff}
.pay-section .btn:hover{background:var(--c-primary-dark)}
.pay-section .btn:disabled{opacity:.5;cursor:not-allowed}
.pay-section .alipay-icon{font-size:24px;margin-right:8px;vertical-align:middle}

/* 提示 */
.notice{background:#fff7e8;border:1px solid #ffd591;border-radius:8px;padding:12px 16px;margin-top:24px;font-size:13px;color:#d46b08}
.notice strong{color:#fa8c16}

/* 状态 */
.status-loading{text-align:center;padding:40px 0;color:var(--c-text-2)}
.status-loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--c-border);border-top-color:var(--c-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

footer{background:var(--c-card);border-top:1px solid var(--c-border);padding:32px 0;text-align:center;font-size:13px;color:var(--c-text-2);margin-top:48px}
</style>
</head>
<body>

<header>
  <div class="container">
    <h1><span class="logo">📚</span> 中国教材库</h1>
    <span class="back" onclick="history.back()">← 返回</span>
  </div>
</header>

<div class="container">
  <div id="content">
    <div class="status-loading"><div class="spinner"></div><p style="margin-top:12px">正在获取教材信息…</p></div>
  </div>
</div>

<footer>
  <div class="container">
    <p>教材来源：<a href="https://github.com/mfujun2025/ChinaTextbook" target="_blank">ChinaTextbook 开源项目</a></p>
    <p style="margin-top:8px">本站仅提供教材索引与下载链接，教材版权归原作者及出版社所有。</p>
  </div>
</footer>

<script>
const WORKER_URL = 'https://chinatextbook-pay.mfujun2025.workers.dev';
let selectedPrice = null;
let bookInfo = null;

async function init() {
  const params = new URLSearchParams(window.location.search);
  const bookId = params.get('book');
  const bookName = params.get('name');
  const stage = params.get('stage') || '';
  const subject = params.get('subject') || '';
  const version = params.get('version') || '';
  const grade = params.get('grade') || '';

  if (!bookId || !bookName) {
    document.getElementById('content').innerHTML = '<div class="notice">缺少参数，请从教材列表页进入。</div>';
    return;
  }

  bookInfo = { bookId, bookName, stage, subject, version, grade };

  // 渲染教材信息
  let badges = '';
  if (stage) badges += `<span class="badge stage">${stage}</span>`;
  if (subject) badges += `<span class="badge subject">${subject}</span>`;

  document.getElementById('content').innerHTML = `
    <div class="book-info">
      <h2>${bookName}</h2>
      <div class="meta">
        ${badges}
        ${version ? '<span>版本：' + version + '</span>' : ''}
        ${grade ? '<span>年级：' + grade + '</span>' : ''}
      </div>
    </div>
    <div class="pricing-section">
      <h3>选择购买方案</h3>
      <div class="pricing-grid" id="pricingGrid">
        <div class="status-loading"><div class="spinner"></div></div>
      </div>
    </div>
    <div class="pay-section" id="paySection" style="display:none">
      <div class="total">合计：<span class="amount" id="totalAmount">¥0.00</span></div>
      <button class="btn" id="payBtn" disabled>
        <span class="alipay-icon">🅰️</span> 支付宝支付
      </button>
    </div>
    <div class="notice">
      <strong>📌 购买须知：</strong>支付成功后自动跳转下载页面，下载链接有效期为24小时。分片教材需自行合并后使用。
    </div>
  `;

  await loadPricing();
}

async function loadPricing() {
  try {
    const res = await fetch('data/pricing.json');
    const prices = await res.json();

    const grid = document.getElementById('pricingGrid');
    grid.innerHTML = '';

    prices.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'price-card';
      card.onclick = () => selectPrice(p, card);
      card.innerHTML = `
        <div class="name">${p.name}</div>
        <div class="price"><span class="currency">¥</span>${p.price}</div>
        <div class="desc">${p.description}</div>
        ${i === prices.length - 1 ? '<span class="badge-popular">最划算</span>' : ''}
      `;
      grid.appendChild(card);
    });

    if (prices.length > 0) {
      selectPrice(prices[0], grid.children[0]);
    }
  } catch (e) {
    document.getElementById('pricingGrid').innerHTML = '<div class="notice">加载价格失败：' + e.message + '</div>';
  }
}

function selectPrice(p, card) {
  selectedPrice = p;
  document.querySelectorAll('.price-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');

  document.getElementById('paySection').style.display = 'block';
  document.getElementById('totalAmount').textContent = '¥' + p.price.toFixed(2);
  document.getElementById('payBtn').disabled = false;
}

document.addEventListener('click', (e) => {
  if (e.target.id === 'payBtn' && !e.target.disabled) {
    handlePay();
  }
});

async function handlePay() {
  if (!selectedPrice) return;

  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.textContent = '正在创建订单…';

  try {
    const res = await fetch(`${WORKER_URL}/api/createOrder`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bookId: bookInfo.bookId,
        bookName: bookInfo.bookName + ' - ' + selectedPrice.name,
        amount: selectedPrice.price.toFixed(2),
      }),
    });

    const data = await res.json();
    if (data.pay_url) {
      // 跳转到支付宝支付页面
      window.location.href = data.pay_url;
    } else {
      throw new Error(data.error || '创建订单失败');
    }
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = '<span class="alipay-icon">🅰️</span> 支付宝支付';
    alert('支付失败：' + e.message);
  }
}

init();
</script>
</body>
</html>
