<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付成功 - 中国教材库</title>
<style>
:root{--c-primary:#1677ff;--c-bg:#f5f7fa;--c-card:#fff;--c-text:#1f2329;--c-text-2:#646a73;--c-border:#e5e6eb;--c-green:#00b42a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
a{color:inherit;text-decoration:none}
.card{background:var(--c-card);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:40px;text-align:center;max-width:500px;width:100%}
.card .icon{font-size:60px;margin-bottom:16px}
.card h1{font-size:22px;font-weight:700;margin-bottom:8px}
.card .desc{font-size:14px;color:var(--c-text-2);margin-bottom:24px}
.card .book-name{font-size:16px;font-weight:600;margin-bottom:16px;padding:12px;background:#f7f8fa;border-radius:8px}
.btn{display:inline-block;padding:12px 32px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;border:none;transition:.15s;background:var(--c-primary);color:#fff;margin:4px}
.btn:hover{background:var(--c-primary);opacity:.9}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text)}
.btn-outline:hover{border-color:var(--c-primary);color:var(--c-primary)}
.loading{text-align:center;padding:40px 0;color:var(--c-text-2)}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--c-border);border-top-color:var(--c-primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">正在验证支付状态…</h1>
  <div class="desc" id="desc">请稍候</div>
  <div id="content"></div>
</div>
<script>
const WORKER_URL = 'https://chinatextbook-pay.mfujun2025.workers.dev';

async function verify() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order_id');
  const bookId = params.get('book_id');

  if (!orderId || !bookId) {
    showResult(false, '参数缺失');
    return;
  }

  try {
    // 轮询查询订单状态
    for (let i = 0; i < 10; i++) {
      const res = await fetch(`${WORKER_URL}/api/query?order_id=${orderId}`);
      const data = await res.json();

      if (data.status === 'paid') {
        // 获取下载链接
        const dlRes = await fetch(`${WORKER_URL}/api/download?order_id=${orderId}&book_id=${encodeURIComponent(bookId)}`);
        const dlData = await dlRes.json();
        showResult(true, data.book_name || '', dlData.download_url || '');
        return;
      } else if (data.status === 'pending') {
        // 还在等待支付，继续轮询
        await new Promise(r => setTimeout(r, 2000));
      } else {
        showResult(false, '订单状态异常: ' + data.status);
        return;
      }
    }
    showResult(false, '支付确认超时，请稍后在订单列表中查看');
  } catch (e) {
    showResult(false, '查询失败: ' + e.message);
  }
}

function showResult(success, msg, downloadUrl) {
  document.getElementById('icon').textContent = success ? '✅' : '⚠️';
  document.getElementById('title').textContent = success ? '支付成功！' : '支付确认失败';
  document.getElementById('desc').textContent = success ? '请点击下方按钮下载教材' : msg;
  document.getElementById('content').innerHTML = success ? `
    <div class="book-name">${msg}</div>
    <a class="btn" href="${downloadUrl}" target="_blank">⬇ 立即下载</a>
    <a class="btn btn-outline" href="index.html">返回首页</a>
  ` : `
    <div class="book-name">${msg}</div>
    <a class="btn btn-outline" href="index.html">返回首页</a>
  `;
}

verify();
</script>
</body>
</html>
